<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOÜ Anestezi Dijital Arşiv Portalı</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-sidebar: #111827;
      --bg-card: #1e293b;
      --bg-card-hover: #263349;
      --bg-input: #0f172a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-soft: rgba(13, 148, 136, 0.15);
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Sidebar */
    .sidebar {
      width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.25s ease;
      position: sticky; top: 0; height: 100vh; z-index: 50;
    }
    .brand { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; color: #fff; flex-shrink: 0;
    }
    .brand-text h1 { font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    .nav-list { padding: 0.75rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-item {
      width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
      color: var(--text-muted); padding: 0.7rem 0.85rem; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-main); }
    .nav-item.active { background: var(--accent-soft); color: #2dd4bf; border-color: rgba(45, 212, 191, 0.3); font-weight: 600; }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; overflow: hidden; }
    .nav-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 0.7rem; background: var(--bg-card); color: var(--text-muted); padding: 2px 7px; border-radius: 99px; }

    .sidebar-footer { padding: 0.85rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .sync-status { font-size: 0.72rem; color: var(--text-muted); text-align: center; }
    .btn-sm {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.55rem; border-radius: 7px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.35rem; width: 100%;
    }
    .btn-sm:hover { background: var(--bg-card-hover); }

    /* Main Content */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 30;
    }
    .menu-btn {
      display: none; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.5rem 0.65rem; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
    }
    .search-box { flex: 1; position: relative; }
    .search-box input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.85rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent); border: none; color: #fff; padding: 0.6rem 1rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .container { padding: 1.5rem; max-width: 1200px; width: 100%; margin: 0 auto; flex: 1; }
    .header-box { margin-bottom: 1.25rem; }
    .header-box h2 { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .header-box p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* Tabs */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .tab {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Grids & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.9rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem;
      transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); background: var(--bg-card-hover); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.6rem; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); line-height: 1.35; }
    .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; background: var(--accent-soft); color: #2dd4bf; white-space: nowrap; }
    .card-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 0.85rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.65rem; border-top: 1px solid rgba(51,65,85,0.6); font-size: 0.75rem; color: var(--text-muted); }
    .link-btn { color: #2dd4bf; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .link-btn:hover { text-decoration: underline; }
    .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.75rem; opacity: 0.85; }
    .del-btn:hover { opacity: 1; text-decoration: underline; }

    .back-btn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.45rem 0.85rem; border-radius: 7px; font-size: 0.8rem; cursor: pointer; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.4rem;
    }

    .info-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; line-height: 1.6; }
    .info-panel h3 { color: #2dd4bf; font-size: 1.05rem; margin-bottom: 0.5rem; }
    .info-panel ul { padding-left: 1.25rem; color: var(--text-muted); font-size: 0.88rem; margin-top: 0.5rem; }
    .info-panel li { margin-bottom: 0.4rem; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none; align-items: center;
      justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 12px;
      width: 100%; max-width: 480px; padding: 1.25rem; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.6rem 0.75rem; border-radius: 7px; font-size: 0.85rem;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }
    .overlay.show { display: block; }

    footer { text-align: center; padding: 1rem; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); }

    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

  <!-- Sol Menü -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">KOÜ</div>
      <div class="brand-text">
        <h1>Anestezi Dijital Arşivi</h1>
        <p>SHMYO • Kurumsal Hafıza</p>
      </div>
    </div>

    <nav class="nav-list" id="navList"></nav>

    <div class="sidebar-footer">
      <div class="sync-status" id="syncStatus">Veritabanı bağlanıyor...</div>
      <button class="btn-sm" onclick="fetchItems()">🔄 Listeyi Yenile</button>
    </div>
  </aside>

  <!-- Ana İçerik -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ders, çıkmış soru, vaka, cihaz veya açıklama ara..." oninput="renderContent()">
      </div>
      <button class="btn-primary" onclick="openModal()">+ İçerik Ekle</button>
    </header>

    <div class="container" id="appContent"></div>

    <footer>
      Kocaeli Üniversitesi SHMYO Anestezi Programı • Canlı Dijital Arşiv Sistemi
    </footer>
  </main>

  <!-- İçerik Ekleme Modalı -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Arşive Yeni İçerik Ekle</h3>
      <div class="form-group">
        <label>Klasör / Kategori</label>
        <select id="fCategory" onchange="updateSubOptions()">
          <option value="soru">02_Anestezi_Soru_Havuzu</option>
          <option value="not">03_Ders_Notlari_ve_Ozetler</option>
          <option value="vaka">04_Klinik_Vaka_Havuzu</option>
          <option value="gorsel">05_Gorsel_Arsiv</option>
        </select>
      </div>
      <div class="form-group" id="classGroup">
        <label>Sınıf Düzeyi</label>
        <select id="fClass" onchange="updateSubOptions()">
          <option value="1">1. Sınıf</option>
          <option value="2">2. Sınıf</option>
        </select>
      </div>
      <div class="form-group">
        <label id="subLabel">Ders Seçimi</label>
        <select id="fSub"></select>
      </div>
      <div class="form-group">
        <label>Başlık</label>
        <input type="text" id="fTitle" placeholder="Örn: 2025 Vize Çıkmış Sorular / Laringoskopi Videosu">
      </div>
      <div class="form-group">
        <label>Açıklama / Klinik Özet / Hoca Notu</label>
        <textarea id="fDesc" rows="3" placeholder="İçerik hakkında kısa açıklama veya önemli noktalar..."></textarea>
      </div>
      <div class="form-group">
        <label>Google Drive veya Video Bağlantısı (Link)</label>
        <input type="url" id="fLink" placeholder="https://drive.google.com/... veya https://youtu.be/...">
      </div>
      <div class="form-group">
        <label>Ekleyen / Dönem</label>
        <input type="text" id="fAuthor" placeholder="Örn: Mücahit K. - 2. Sınıf">
      </div>
      <div class="form-group">
        <label style="color:#2dd4bf; font-weight:600;">Editör Yetki Şifresi *</label>
        <input type="password" id="fPassword" placeholder="Editör şifresini girin">
      </div>
      <div class="modal-actions">
        <button class="btn-sm" style="width:auto; padding:0.6rem 1rem;" onclick="closeModal()">İptal</button>
        <button class="btn-primary" id="saveBtn" onclick="saveItem()">Canlı Arşive Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw48prKjCXcj5Xgl1DsEoCoFTZmIDurAX1eVwhoSAUgWwFXRmkSzmRz9YlY0mP86CY58A/exec";

    const CURRICULUM = {
      "1": [
        "Anestezi Cihaz ve Ekipmanları",
        "Anestezi ve Reanimasyon",
        "Fizyoloji",
        "Tıbbi Terminoloji",
        "Anatomi",
        "Farmakoloji",
        "Post-op Bakım",
        "Klinik Anestezi 1",
        "Sistem Hastalıkları",
        "Enfeksiyon Hastalıkları"
      ],
      "2": [
        "Mesleki Uygulama",
        "Özellikli Cerrahilerde Anestezi",
        "Anestezi Uygulamaları",
        "Klinik Anestezi 2"
      ]
    };

    const SURGICAL_BRANCHES = [
      "Genel Cerrahi",
      "Ortopedi ve Travmatoloji",
      "Beyin ve Sinir Cerrahisi (Nöroşirürji)",
      "Kalp ve Damar Cerrahisi (KVC)",
      "Göğüs Cerrahisi",
      "Kadın Hastalıkları ve Doğum",
      "Üroloji",
      "Kulak Burun Boğaz (KBB)",
      "Plastik, Rekonstrüktif ve Estetik Cerrahi",
      "Çocuk Cerrahisi (Pediatrik Anestezi)"
    ];

    const FOLDERS = [
      { id: "yonerge", code: "01", name: "01_Arsiv_Hakkinda_ve_Yonerge" },
      { id: "soru",    code: "02", name: "02_Anestezi_Soru_Havuzu" },
      { id: "not",     code: "03", name: "03_Ders_Notlari_ve_Ozetler" },
      { id: "vaka",    code: "04", name: "04_Klinik_Vaka_Havuzu" },
      { id: "gorsel",  code: "05", name: "05_Gorsel_Arsiv" }
    ];

    let items = [];
    let isLoading = true;
    let activeFolder = "soru";
    let activeClass = "1";
    let selectedSub = null;

    async function fetchItems() {
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "Veriler güncelleniyor...";
      isLoading = true;
      renderContent();

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (Array.isArray(data)) {
          items = data;
          localStorage.setItem("kou_anestezi_cache", JSON.stringify(items));
          statusEl.textContent = "🟢 Canlı Bağlantı Aktif (" + items.length + " kayıt)";
        }
      } catch (err) {
        const cached = localStorage.getItem("kou_anestezi_cache");
        items = cached ? JSON.parse(cached) : [];
        statusEl.textContent = "🟡 Çevrimdışı Önbellek Gösteriliyor";
      } finally {
        isLoading = false;
        renderSidebar();
        renderContent();
      }
    }

    function toggleSidebar(show) {
      document.getElementById("sidebar").classList.toggle("open", show);
      document.getElementById("overlay").classList.toggle("show", show);
    }

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = FOLDERS.map(f => {
        const count = f.id === "yonerge" ? "Bilgi" : items.filter(i => i.category === f.id).length;
        return `
          <button class="nav-item ${activeFolder === f.id ? 'active' : ''}" onclick="selectFolder('${f.id}')">
            <span class="nav-left">
              <span>📁</span>
              <span class="nav-title">${f.name}</span>
            </span>
            <span class="badge">${count}</span>
          </button>
        `;
      }).join("");
    }

    function selectFolder(id) {
      activeFolder = id;
      selectedSub = null;
      document.getElementById("searchInput").value = "";
      toggleSidebar(false);
      renderSidebar();
      renderContent();
    }

    function selectClass(cls) {
      activeClass = cls;
      selectedSub = null;
      renderContent();
    }

    function selectSub(sub) {
      selectedSub = sub;
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById("appContent");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      if (isLoading && items.length === 0 && activeFolder !== "yonerge") {
        container.innerHTML = `<div class="info-panel"><p style="color:#2dd4bf;">⏳ Google E-Tablo veritabanından güncel kayıtlar çekiliyor...</p></div>`;
        return;
      }

      if (query) {
        const filtered = items.filter(i =>
          (i.title || "").toLowerCase().includes(query) ||
          (i.desc || "").toLowerCase().includes(query) ||
          (i.sub || "").toLowerCase().includes(query)
        );
        container.innerHTML = `
          <div class="header-box">
            <h2>Arama Sonuçları ("${query}")</h2>
            <p>${filtered.length} kayıt bulundu</p>
          </div>
          ${renderItemCards(filtered)}
        `;
        return;
      }

      if (activeFolder === "yonerge") {
        container.innerHTML = `
          <div class="header-box">
            <h2>01_Arsiv_Hakkinda_ve_Yonerge</h2>
            <p>Kocaeli Üniversitesi SHMYO Anestezi Programı Ortak Bilgi ve Kaynak Sistemi</p>
          </div>
          <div class="info-panel">
            <h3>Sistemin Amacı ve Kullanım Kuralları</h3>
            <p style="font-size:0.88rem; color:var(--text-muted);">
              Bu dijital arşiv; 1. ve 2. sınıf öğrencilerinin ders notlarına, çıkmış sınav sorularına, klinik vaka analizlerine ve görsel eğitim materyallerine tek merkezden ulaşması için oluşturulmuştur.
            </p>
            <ul>
              <li><strong>Canlı Veritabanı:</strong> Tüm kayıtlar Google E-Tablolar altyapısı üzerinden anlık olarak senkronize edilir.</li>
              <li><strong>Klasör Yapısı:</strong> İçerikler Google Drive ana diziniyle birebir uyumlu olarak 5 ana başlıkta toplanmıştır.</li>
              <li><strong>İçerik Ekleme Yetkisi:</strong> Sağ üstteki <em>"+ İçerik Ekle"</em> butonu yalnızca editör şifresine sahip sınıf temsilcileri tarafından kullanılabilir.</li>
              <li><strong>KVKK ve Hasta Gizliliği:</strong> Klinik vaka havuzuna eklenen hiçbir vakada hasta adı, T.C. kimlik veya protokol numarası paylaşılmamalıdır.</li>
            </ul>
          </div>
        `;
        return;
      }

      if (activeFolder === "soru" || activeFolder === "not") {
        const folderTitle = activeFolder === "soru" ? "02_Anestezi_Soru_Havuzu" : "03_Ders_Notlari_ve_Ozetler";
        const courses = CURRICULUM[activeClass];

        if (!selectedSub) {
          container.innerHTML = `
            <div class="header-box">
              <h2>${folderTitle}</h2>
              <p>İçerikleri görüntülemek için sınıf düzeyini ve dersi seçin</p>
            </div>
            <div class="tabs">
              <button class="tab ${activeClass === '1' ? 'active' : ''}" onclick="selectClass('1')">1. Sınıf Dersleri (${CURRICULUM['1'].length})</button>
              <button class="tab ${activeClass === '2' ? 'active' : ''}" onclick="selectClass('2')">2. Sınıf Dersleri (${CURRICULUM['2'].length})</button>
            </div>
            <div class="grid">
              ${courses.map(course => {
                const count = items.filter(i => i.category === activeFolder && String(i.classLevel) === activeClass && i.sub === course).length;
                return `
                  <div class="card clickable" onclick="selectSub('${course.replace(/'/g, "\\'")}')">
                    <div class="card-top">
                      <span class="card-title">📘 ${course}</span>
                      <span class="tag">${activeClass}. Sınıf</span>
                    </div>
                    <div class="card-footer">
                      <span>${count} içerik kayıtlı</span>
                      <span style="color:#2dd4bf; font-weight:600;">Aç →</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } else {
          const filtered = items.filter(i => i.category === activeFolder && String(i.classLevel) === activeClass && i.sub === selectedSub);
          container.innerHTML = `
            <button class="back-btn" onclick="selectSub(null)">← ${activeClass}. Sınıf Derslerine Dön</button>
            <div class="header-box">
              <h2>${selectedSub}</h2>
              <p>${folderTitle} • ${activeClass}. Sınıf</p>
            </div>
            ${renderItemCards(filtered)}
          `;
        }
        return;
      }

      if (activeFolder === "vaka") {
        if (!selectedSub) {
          container.innerHTML = `
            <div class="header-box">
              <h2>04_Klinik_Vaka_Havuzu</h2>
              <p>Ameliyathane stajı ve klinik vaka analizleri için cerrahi branş seçin</p>
            </div>
            <div class="grid">
              ${SURGICAL_BRANCHES.map(branch => {
                const count = items.filter(i => i.category === "vaka" && i.sub === branch).length;
                return `
                  <div class="card clickable" onclick="selectSub('${branch.replace(/'/g, "\\'")}')">
                    <div class="card-top">
                      <span class="card-title">🏥 ${branch}</span>
                    </div>
                    <div class="card-footer">
                      <span>${count} vaka kaydı</span>
                      <span style="color:#2dd4bf; font-weight:600;">Vakaları Gör →</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } else {
          const filtered = items.filter(i => i.category === "vaka" && i.sub === selectedSub);
          container.innerHTML = `
            <button class="back-btn" onclick="selectSub(null)">← Cerrahi Branşlara Dön</button>
            <div class="header-box">
              <h2>${selectedSub}</h2>
              <p>04_Klinik_Vaka_Havuzu</p>
            </div>
            ${renderItemCards(filtered)}
          `;
        }
        return;
      }

      if (activeFolder === "gorsel") {
        const filtered = items.filter(i => i.category === "gorsel");
        container.innerHTML = `
          <div class="header-box">
            <h2>05_Gorsel_Arsiv</h2>
            <p>Cihaz kurulumları, entübasyon videoları, EKG örnekleri ve açıklamalı görsel materyaller</p>
          </div>
          ${renderItemCards(filtered)}
        `;
      }
    }

    function renderItemCards(list) {
      if (!list.length) {
        return `<div class="info-panel"><p style="color:var(--text-muted); font-size:0.9rem;">Bu bölümde henüz kayıtlı içerik yok. Editör şifrenizle sağ üstteki <strong>"+ İçerik Ekle"</strong> butonunu kullanarak ilk kaynağı ekleyebilirsiniz.</p></div>`;
      }
      return `
        <div class="grid">
          ${list.map(item => `
            <div class="card">
              <div>
                <div class="card-top">
                  <span class="card-title">${item.title}</span>
                  <span class="tag">${item.sub}</span>
                </div>
                <p class="card-desc">${item.desc || "Açıklama girilmemiş."}</p>
              </div>
              <div class="card-footer">
                <span>${item.author || "Arşiv"}</span>
                <div style="display:flex; gap:0.75rem; align-items:center;">
                  ${item.link ? `<a href="${item.link}" target="_blank" class="link-btn">Dosyayı Aç ↗</a>` : ''}
                  <button class="del-btn" onclick="deleteItem('${item.id}')">Sil</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openModal() {
      if (activeFolder !== "yonerge") {
        document.getElementById("fCategory").value = activeFolder;
      }
      document.getElementById("fClass").value = activeClass;
      updateSubOptions();
      if (selectedSub) {
        document.getElementById("fSub").value = selectedSub;
      }
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function updateSubOptions() {
      const cat = document.getElementById("fCategory").value;
      const clsGroup = document.getElementById("classGroup");
      const subSelect = document.getElementById("fSub");
      const subLabel = document.getElementById("subLabel");

      if (cat === "soru" || cat === "not") {
        clsGroup.style.display = "block";
        subLabel.textContent = "Ders Seçimi";
        const cls = document.getElementById("fClass").value;
        subSelect.innerHTML = CURRICULUM[cls].map(c => `<option value="${c}">${c}</option>`).join("");
      } else if (cat === "vaka") {
        clsGroup.style.display = "none";
        subLabel.textContent = "Cerrahi Branş";
        subSelect.innerHTML = SURGICAL_BRANCHES.map(b => `<option value="${b}">${b}</option>`).join("");
      } else {
        clsGroup.style.display = "none";
        subLabel.textContent = "Materyal Türü";
        subSelect.innerHTML = `
          <option value="Cihaz & Ekipman">Cihaz & Ekipman</option>
          <option value="Havayolu & Entübasyon">Havayolu & Entübasyon</option>
          <option value="Monitörizasyon & EKG">Monitörizasyon & EKG</option>
          <option value="Uygulama Videosu">Uygulama Videosu</option>
          <option value="Diğer Görsel">Diğer Görsel</option>
        `;
      }
    }

    async function saveItem() {
      const category = document.getElementById("fCategory").value;
      const classLevel = (category === "soru" || category === "not") ? document.getElementById("fClass").value : "";
      const sub = document.getElementById("fSub").value;
      const title = document.getElementById("fTitle").value.trim();
      const desc = document.getElementById("fDesc").value.trim();
      const link = document.getElementById("fLink").value.trim();
      const author = document.getElementById("fAuthor").value.trim();
      const password = document.getElementById("fPassword").value.trim();

      if (!title) { alert("Lütfen bir başlık girin."); return; }
      if (!password) { alert("Lütfen editör yetki şifresini girin."); return; }

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Kaydediliyor...";

      const newItem = { id: String(Date.now()), category, classLevel, sub, title, desc, link, author };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "add", password, item: newItem })
        });
        const result = await res.json();

        if (result.status === "ok") {
          document.getElementById("fTitle").value = "";
          document.getElementById("fDesc").value = "";
          document.getElementById("fLink").value = "";
          closeModal();

          activeFolder = category;
          if (classLevel) activeClass = classLevel;
          selectedSub = sub;
          await fetchItems();
        } else {
          alert(result.message || "Şifre hatalı veya işlem reddedildi!");
        }
      } catch (err) {
        alert("Sunucuya bağlanırken bir hata oluştu. İnternet bağlantınızı kontrol edin.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Canlı Arşive Kaydet";
      }
    }

    async function deleteItem(id) {
      const password = prompt("Bu kaydı canlı veritabanından silmek için editör şifresini girin:");
      if (!password) return;

      document.getElementById("syncStatus").textContent = "Kayıt siliniyor...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", password, id: String(id) })
        });
        const result = await res.json();

        if (result.status === "ok") {
          await fetchItems();
        } else {
          alert(result.message || "Hatalı şifre! Silme işlemi iptal edildi.");
          document.getElementById("syncStatus").textContent = "🟢 Canlı Bağlantı Aktif";
        }
      } catch (err) {
        alert("Silme işlemi sırasında bağlantı hatası oluştu.");
      }
    }

    // Başlangıçta verileri çek
    renderSidebar();
    fetchItems();
  </script>
</body>
</html>
